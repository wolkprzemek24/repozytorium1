name: Security
on: [push, pull_request]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - [cite_start]name: Run Bandit # [cite: 66]
        run: |
          pip install bandit
          bandit -r .
      - [cite_start]name: Run Safety # [cite: 67]
        run: |
          pip install safety
          safety check # [cite: 68]
