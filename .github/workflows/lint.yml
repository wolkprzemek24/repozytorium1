name: Linting
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Linters # [cite: 28]
        run: |
          pip install flake8 black isort
          flake8 . 
          black --check . 
          isort --check-only . 
